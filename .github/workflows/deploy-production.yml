name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: 24
  PNPM_VERSION: 11.3.0
  INFISICAL_PROJECT_SLUG: uwdsc-54e-y
  INFISICAL_SECRET_PATH: /cxc

jobs:
  setup:
    name: Setup Variables
    runs-on: ubuntu-latest
    outputs:
      node-version: ${{ env.NODE_VERSION }}
      pnpm-version: ${{ env.PNPM_VERSION }}
      infisical-project-slug: ${{ env.INFISICAL_PROJECT_SLUG }}
      infisical-secret-path: ${{ env.INFISICAL_SECRET_PATH }}
    steps:
      - name: Output variables
        run: echo "Variables mapped to outputs."

  code-quality:
    name: Code Quality
    needs: setup
    uses: uw-datasci/nexus-workflows/.github/workflows/quality-gate.yml@v4
    with:
      node-version: ${{ needs.setup.outputs.node-version }}
      pnpm-version: ${{ needs.setup.outputs.pnpm-version }}
      lint-command: pnpm lint
      typecheck-command: pnpm typecheck

  deploy:
    name: Deploy to Vercel (Production)
    needs: [setup, code-quality]
    if: ${{ github.ref == 'refs/heads/main' }}
    uses: uw-datasci/nexus-workflows/.github/workflows/deploy-vercel.yml@v4
    with:
      node-version: ${{ needs.setup.outputs.node-version }}
      pnpm-version: ${{ needs.setup.outputs.pnpm-version }}
      is-prod: true
      infisical-project-slug: ${{ needs.setup.outputs.infisical-project-slug }}
      infisical-secret-path: ${{ needs.setup.outputs.infisical-secret-path }}
    secrets:
      INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
      INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [code-quality, deploy]
    if: always()
    steps:
      - name: Write summary
        env:
          QUALITY: ${{ needs.code-quality.result }}
          DEPLOY: ${{ needs.deploy.result }}
          URL: ${{ needs.deploy.outputs.deployment-url }}
        run: |
          {
            echo "## Production Deployment"
            echo ""
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Code Quality | \`$QUALITY\` |"
            echo "| Deploy | \`$DEPLOY\` |"
            echo ""
            if [ "$DEPLOY" = "success" ]; then
              echo "**URL:** $URL"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
